name: Download TrollStore All Versions

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all versions
        run: |
          REPO="opa334/TrollStore"
          OUTPUT_DIR="TrollStore-AllVersions"
          mkdir -p "$OUTPUT_DIR"

          echo "获取所有版本标签..."
          TAGS=$(git ls-remote --tags --sort=-v:refname "https://github.com/${REPO}.git" \
            | grep -v '\^{}' \
            | sed 's/.*refs\/tags\///' \
            | sort -u)

          TAG_COUNT=$(echo "$TAGS" | wc -l)
          echo "共找到 $TAG_COUNT 个版本标签"
          echo "$TAGS"
          echo "-------------------"

          SUCCESS=0
          FAIL=0

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue

            echo -n "  下载 ${tag}.zip ... "

            if curl -sL --connect-timeout 30 --max-time 120 \
              -o "${OUTPUT_DIR}/${tag}.zip" \
              "https://github.com/${REPO}/archive/refs/tags/${tag}.zip"; then
              SIZE=$(ls -lh "${OUTPUT_DIR}/${tag}.zip" | awk '{print $5}')
              echo "✓ ($SIZE)"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "✗"
              FAIL=$((FAIL + 1))
            fi
          done <<< "$TAGS"

          echo ""
          echo "下载完成: 成功 $SUCCESS, 失败 $FAIL"

      - name: Package and summarize
        run: |
          zip -r TrollStore-AllVersions.zip TrollStore-AllVersions/

          echo "## 打包结果" >> $GITHUB_STEP_SUMMARY
          TOTAL_SIZE=$(ls -lh TrollStore-AllVersions.zip | awk '{print $5}')
          echo "**总大小**: $TOTAL_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "**版本数**: $(ls TrollStore-AllVersions/*.zip | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 版本 | 大小 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          ls -lh TrollStore-AllVersions/*.zip | awk '{print "| " $NF " | " $5 " |"}' | sed 's|TrollStore-AllVersions/||' >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-AllVersions
          path: TrollStore-AllVersions.zip
          retention-days: 7
