name: Download TrollStore All Versions

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all versions source code
        run: |
          REPO="opa334/TrollStore"
          OUTPUT_DIR="TrollStore-AllVersions"
          mkdir -p "$OUTPUT_DIR"

          # 获取所有 tags（按版本倒序）
          echo "获取所有版本标签..."
          TAGS=$(git ls-remote --tags --sort=-v:refname "https://github.com/${REPO}.git" \
            | grep -v '\^{}' \
            | sed 's/.*refs\/tags\///' \
            | sort -u)

          TAG_COUNT=$(echo "$TAGS" | wc -l)
          echo "共找到 $TAG_COUNT 个版本标签"
          echo "$TAGS"
          echo "-------------------"

          SUCCESS=0
          FAIL=0

          # 逐个下载
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue

            SAFE_TAG=$(echo "$tag" | sed 's/[\/\\:*?"<>|]/_/g')
            echo -n "  下载 $SAFE_TAG ... "

            ZIP_URL="https://github.com/${REPO}/archive/refs/tags/${tag}.zip"
            LOCAL_ZIP="${SAFE_TAG}.zip"

            if curl -sL --connect-timeout 30 --max-time 120 -o "$LOCAL_ZIP" "$ZIP_URL"; then
              # 解压并重命名
              unzip -q "$LOCAL_ZIP" -d tmp_extract 2>/dev/null
              EXTRACTED=$(find tmp_extract -mindepth 1 -maxdepth 1 -type d | head -1)
              if [ -n "$EXTRACTED" ]; then
                mv "$EXTRACTED" "${OUTPUT_DIR}/${SAFE_TAG}"
                echo "✓"
                SUCCESS=$((SUCCESS + 1))
              else
                echo "✗ 解压失败"
                FAIL=$((FAIL + 1))
              fi
              rm -rf tmp_extract
            else
              echo "✗ 下载失败"
              FAIL=$((FAIL + 1))
            fi

            rm -f "$LOCAL_ZIP"
          done <<< "$TAGS"

          echo ""
          echo "下载完成: 成功 $SUCCESS, 失败 $FAIL"

      - name: Package as zip
        run: |
          zip -r TrollStore-AllVersions.zip TrollStore-AllVersions/
          echo "## 文件大小"
          ls -lh TrollStore-AllVersions.zip
          echo "## 文件夹内容"
          echo "TrollStore-AllVersions/" >> $GITHUB_STEP_SUMMARY
          ls TrollStore-AllVersions/ >> $GITHUB_STEP_SUMMARY
          echo "共 $(ls TrollStore-AllVersions/ | wc -l) 个版本" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-AllVersions
          path: TrollStore-AllVersions.zip
          retention-days: 7
