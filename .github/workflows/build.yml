name: Build TrollHelper OTA IPAs

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload to GitHub Release'
        required: false
        default: 'false'
      build_victim:
        description: 'Rebuild and upload InstallerVictim.ipa to Release'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid openssl@3

      - name: Download or Build InstallerVictim.ipa
        id: victim
        run: |
          mkdir -p Victim
          # Try to download from latest release
          DOWNLOAD_URL=$(curl -sL "https://api.github.com/repos/${{ github.repository }}/releases/latest" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for a in data.get('assets', []):
              if a['name'] == 'InstallerVictim.ipa':
                  print(a['browser_download_url'])
                  break
          " 2>/dev/null)
          if [ -n "$DOWNLOAD_URL" ]; then
              echo "Downloading InstallerVictim.ipa from Release..."
              curl -L -o Victim/InstallerVictim.ipa "$DOWNLOAD_URL"
              echo "downloaded=true" >> $GITHUB_OUTPUT
          else
              echo "No pre-built InstallerVictim.ipa found, building from scratch..."
              echo "downloaded=false" >> $GITHUB_OUTPUT
          fi

      - name: Build InstallerVictim.ipa from scratch
        if: steps.victim.outputs.downloaded != 'true'
        run: |
          echo "=== Cross-compiling minimal arm64 binary ==="
          cat > /tmp/dummy.m << 'EOF'
          #import <Foundation/Foundation.h>
          int main(int argc, char *argv[]) {
              @autoreleasepool { }
              return 0;
          }
          EOF
          # Build arm64 slice
          xcrun -sdk iphoneos clang -arch arm64 \
            -miphoneos-version-min=14.0 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            /tmp/dummy.m -o /tmp/TV_arm64 \
            -framework Foundation -lobjc
          file /tmp/TV_arm64

          # Try to build arm64e slice (for A12+ support)
          xcrun -sdk iphoneos clang -arch arm64e \
            -miphoneos-version-min=14.0 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            /tmp/dummy.m -o /tmp/TV_arm64e \
            -framework Foundation -lobjc 2>/dev/null || true

          # Create fat binary if arm64e succeeded
          if [ -f /tmp/TV_arm64e ]; then
              echo "Creating fat binary (arm64 + arm64e)..."
              lipo -create /tmp/TV_arm64 /tmp/TV_arm64e -output /tmp/TV
          else
              echo "Using arm64 only..."
              cp /tmp/TV_arm64 /tmp/TV
          fi
          file /tmp/TV

          echo "=== Creating TV.app bundle ==="
          mkdir -p Payload/TV.app
          cp /tmp/TV Payload/TV.app/TV

          cat > Payload/TV.app/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.apple.tv</string>
              <key>CFBundleExecutable</key>
              <string>TV</string>
              <key>CFBundleName</key>
              <string>TV</string>
              <key>CFBundleDisplayName</key>
              <string>TV</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
          </dict>
          </plist>
          PLIST

          echo "=== Packaging IPA ==="
          mkdir -p Victim
          zip -r Victim/InstallerVictim.ipa Payload/
          echo "Created InstallerVictim.ipa:"
          ls -la Victim/InstallerVictim.ipa
          file Victim/InstallerVictim.ipa
          rm -rf Payload

      - name: Upload InstallerVictim.ipa to Release
        if: steps.victim.outputs.downloaded != 'true' && (github.event.inputs.build_victim == 'true' || github.event_name == 'push')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: victim-v1
          files: Victim/InstallerVictim.ipa
          body: |
            ## InstallerVictim.ipa
            Pre-built victim IPA (com.apple.tv) for TrollHelper OTA builds.
            Generated via cross-compilation on macOS runner.
          draft: false
          prerelease: true

      - name: Verify Victim IPA
        run: |
          echo "=== Victim IPA Info ==="
          python3 scripts/pwnify.py print Victim/InstallerVictim.ipa
          echo ""
          file Victim/InstallerVictim.ipa

      - name: Generate victim.p12
        run: bash scripts/generate_victim_cert.sh MRLQS75089

      - name: Verify helper binaries
        run: |
          for f in helpers/PersistenceHelper_Embedded_Legacy_arm64 helpers/PersistenceHelper_Embedded_Legacy_arm64e; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing $f"
              exit 1
            fi
            python3 scripts/pwnify.py print "$f"
            echo "---"
          done

      - name: Build TrollHelper_iOS15.ipa (arm64, A8-A11)
        run: |
          mkdir -p _build/tmp15
          unzip -o Victim/InstallerVictim.ipa -d _build/tmp15
          APP_PATH=$(find _build/tmp15/Payload -maxdepth 1 -mindepth 1 -type d | head -1)
          APP_NAME=$(basename "$APP_PATH")
          BINARY_NAME=$(echo "$APP_NAME" | cut -f1 -d'.')
          echo "App: $APP_NAME, Binary: $BINARY_NAME"
          cp helpers/PersistenceHelper_Embedded_Legacy_arm64 _build/TrollStorePersistenceHelperToInject
          python3 scripts/pwnify.py set-cpusubtype _build/TrollStorePersistenceHelperToInject 1
          ldid -S -K./victim.p12 _build/TrollStorePersistenceHelperToInject
          python3 scripts/pwnify.py pwn "_build/tmp15/Payload/$APP_NAME/$BINARY_NAME" _build/TrollStorePersistenceHelperToInject
          echo "=== Result ==="
          python3 scripts/pwnify.py print "_build/tmp15/Payload/$APP_NAME/$BINARY_NAME"
          cd _build/tmp15 && zip -r ../../TrollHelper_iOS15.ipa Payload/ && cd ../..
          rm -f _build/TrollStorePersistenceHelperToInject
          rm -rf _build/tmp15
          echo "Built TrollHelper_iOS15.ipa ($(du -h TrollHelper_iOS15.ipa | cut -f1))"

      - name: Build TrollHelper_arm64e.ipa (A12+)
        run: |
          mkdir -p _build/tmp64e
          unzip -o Victim/InstallerVictim.ipa -d _build/tmp64e
          APP_PATH=$(find _build/tmp64e/Payload -maxdepth 1 -mindepth 1 -type d | head -1)
          APP_NAME=$(basename "$APP_PATH")
          BINARY_NAME=$(echo "$APP_NAME" | cut -f1 -d'.')
          python3 scripts/pwnify.py pwn64e "_build/tmp64e/Payload/$APP_NAME/$BINARY_NAME" helpers/PersistenceHelper_Embedded_Legacy_arm64e
          echo "=== Result ==="
          python3 scripts/pwnify.py print "_build/tmp64e/Payload/$APP_NAME/$BINARY_NAME"
          cd _build/tmp64e && zip -r ../../TrollHelper_arm64e.ipa Payload/ && cd ../..
          rm -rf _build/tmp64e
          echo "Built TrollHelper_arm64e.ipa ($(du -h TrollHelper_arm64e.ipa | cut -f1))"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrollHelper-IPAs
          path: |
            TrollHelper_iOS15.ipa
            TrollHelper_arm64e.ipa
          retention-days: 30

      - name: Upload to Release
        if: github.event.inputs.upload_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trollhelper-ota-v1.0
          files: |
            TrollHelper_iOS15.ipa
            TrollHelper_arm64e.ipa
          body: |
            ## TrollHelper OTA IPAs
            | File | Device | iOS |
            |------|--------|-----|
            | TrollHelper_iOS15.ipa | A11及以下 (arm64) | 14.0-15.4.1 |
            | TrollHelper_arm64e.ipa | A12+ (arm64e) | 14.0-15.6.1 |
            ### Usage
            Host IPA + manifest.plist on HTTPS server, install via itms-services:// link
          draft: true
