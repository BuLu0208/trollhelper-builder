name: Build TrollHelper OTA IPAs

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload to GitHub Release'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid openssl@3

      - name: Cache InstallerVictim.ipa
        id: cache-victim
        uses: actions/cache@v4
        with:
          path: Victim/InstallerVictim.ipa
          key: tvapp-victim-v2

      - name: Extract TV.app from IPSW
        if: steps.cache-victim.outputs.cache-hit != 'true'
        run: |
          echo "=== Finding iOS 14.8.1 IPSW for iPhone SE (smallest IPSW) ==="
          IPSW_URL=$(curl -sL "https://api.ipsw.me/v4/device/iPhone8,4?type=ipsw" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for fw in data.get('firmwares', []):
              if fw.get('version') == '14.8.1':
                  print(fw['url'])
                  break
          ")
          if [ -z "$IPSW_URL" ]; then
              echo "Trying any iOS 14.x..."
              IPSW_URL=$(curl -sL "https://api.ipsw.me/v4/device/iPhone8,4?type=ipsw" | python3 -c "
              import json, sys
              data = json.load(sys.stdin)
              for fw in data.get('firmwares', []):
                  ver = fw.get('version', '')
                  if ver.startswith('14.'):
                      print(fw['url'])
                      break
              ")
          fi

          if [ -z "$IPSW_URL" ]; then
              echo "ERROR: Could not find a suitable IPSW URL"
              exit 1
          fi

          echo "Downloading IPSW: $IPSW_URL"
          curl -L -o ipsw.zip "$IPSW_URL"
          echo "IPSW size: $(du -h ipsw.zip | cut -f1)"

          echo "=== Extracting IPSW ==="
          unzip -o ipsw.zip -d ipsw_extracted 2>&1 | tail -3

          echo "=== Finding DMG files ==="
          # Find all DMGs, sort by size (largest first = root filesystem)
          DMGS=$(find ipsw_extracted -name "*.dmg" -exec du -b {} \; | sort -rn | head -5)
          echo "$DMGS"

          echo "=== Searching for TV.app in DMGs ==="
          TV_APP_PATH=""
          MOUNT_POINT="/tmp/ipsw_mount"

          while IFS= read -r line; do
              DMG_PATH=$(echo "$line" | awk '{print $2}')
              echo "Checking DMG: $DMG_PATH"
              
              mkdir -p "$MOUNT_POINT"
              hdiutil attach "$DMG_PATH" -mountpoint "$MOUNT_POINT" -nobrowse -quiet 2>/dev/null || true
              sleep 2

              # Search for TV.app or AppleTV.app
              FOUND=$(find "$MOUNT_POINT" -maxdepth 3 -name "TV.app" -o -name "AppleTV.app" 2>/dev/null | head -1)
              
              if [ -n "$FOUND" ]; then
                  echo "Found: $FOUND"
                  TV_APP_PATH="$FOUND"
                  hdiutil detach "$MOUNT_POINT" -quiet 2>/dev/null || true
                  break
              fi

              hdiutil detach "$MOUNT_POINT" -quiet 2>/dev/null || true
          done <<< "$DMGS"

          if [ -z "$TV_APP_PATH" ]; then
              echo "ERROR: TV.app not found in any DMG"
              echo "Listing all .app bundles found:"
              for DMG_PATH in $(find ipsw_extracted -name "*.dmg"); do
                  mkdir -p "$MOUNT_POINT"
                  hdiutil attach "$DMG_PATH" -mountpoint "$MOUNT_POINT" -nobrowse -quiet 2>/dev/null || true
                  sleep 2
                  find "$MOUNT_POINT" -maxdepth 3 -name "*.app" -type d 2>/dev/null | head -20
                  hdiutil detach "$MOUNT_POINT" -quiet 2>/dev/null || true
              done
              exit 1
          fi

          echo "=== Packaging TV.app as IPA ==="
          mkdir -p ipa_payload/Payload
          cp -r "$TV_APP_PATH" ipa_payload/Payload/
          cd ipa_payload && zip -r ../../Victim/InstallerVictim.ipa Payload/ && cd ..
          
          echo "Created InstallerVictim.ipa: $(du -h Victim/InstallerVictim.ipa | cut -f1)"
          
          # Cleanup large files
          rm -rf ipsw.zip ipsw_extracted ipa_payload

      - name: Verify Victim IPA
        run: |
          echo "=== Victim IPA Info ==="
          python3 scripts/pwnify.py print Victim/InstallerVictim.ipa
          echo ""
          file Victim/InstallerVictim.ipa

      - name: Generate victim.p12
        run: bash scripts/generate_victim_cert.sh MRLQS75089

      - name: Verify helper binaries
        run: |
          for f in helpers/PersistenceHelper_Embedded_Legacy_arm64 helpers/PersistenceHelper_Embedded_Legacy_arm64e; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing $f"
              exit 1
            fi
            python3 scripts/pwnify.py print "$f"
            echo "---"
          done

      - name: Build TrollHelper_iOS15.ipa (arm64, A8-A11)
        run: |
          mkdir -p _build/tmp15
          unzip -o Victim/InstallerVictim.ipa -d _build/tmp15

          APP_PATH=$(find _build/tmp15/Payload -maxdepth 1 -mindepth 1 -type d | head -1)
          APP_NAME=$(basename "$APP_PATH")
          BINARY_NAME=$(echo "$APP_NAME" | cut -f1 -d'.')
          echo "App: $APP_NAME, Binary: $BINARY_NAME"

          cp helpers/PersistenceHelper_Embedded_Legacy_arm64 _build/TrollStorePersistenceHelperToInject
          python3 scripts/pwnify.py set-cpusubtype _build/TrollStorePersistenceHelperToInject 1
          ldid -S -K./victim.p12 _build/TrollStorePersistenceHelperToInject
          python3 scripts/pwnify.py pwn "_build/tmp15/Payload/$APP_NAME/$BINARY_NAME" _build/TrollStorePersistenceHelperToInject

          echo "=== Result ==="
          python3 scripts/pwnify.py print "_build/tmp15/Payload/$APP_NAME/$BINARY_NAME"

          cd _build/tmp15 && zip -r ../../TrollHelper_iOS15.ipa Payload/ && cd ../..
          rm -f _build/TrollStorePersistenceHelperToInject
          rm -rf _build/tmp15
          echo "Built TrollHelper_iOS15.ipa ($(du -h TrollHelper_iOS15.ipa | cut -f1))"

      - name: Build TrollHelper_arm64e.ipa (A12+)
        run: |
          mkdir -p _build/tmp64e
          unzip -o Victim/InstallerVictim.ipa -d _build/tmp64e

          APP_PATH=$(find _build/tmp64e/Payload -maxdepth 1 -mindepth 1 -type d | head -1)
          APP_NAME=$(basename "$APP_PATH")
          BINARY_NAME=$(echo "$APP_NAME" | cut -f1 -d'.')

          python3 scripts/pwnify.py pwn64e "_build/tmp64e/Payload/$APP_NAME/$BINARY_NAME" helpers/PersistenceHelper_Embedded_Legacy_arm64e

          echo "=== Result ==="
          python3 scripts/pwnify.py print "_build/tmp64e/Payload/$APP_NAME/$BINARY_NAME"

          cd _build/tmp64e && zip -r ../../TrollHelper_arm64e.ipa Payload/ && cd ../..
          rm -rf _build/tmp64e
          echo "Built TrollHelper_arm64e.ipa ($(du -h TrollHelper_arm64e.ipa | cut -f1))"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrollHelper-IPAs
          path: |
            TrollHelper_iOS15.ipa
            TrollHelper_arm64e.ipa
          retention-days: 30

      - name: Upload to Release
        if: github.event.inputs.upload_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trollhelper-ota-v1.0
          files: |
            TrollHelper_iOS15.ipa
            TrollHelper_arm64e.ipa
          body: |
            ## TrollHelper OTA IPAs

            | File | Device | iOS |
            |------|--------|-----|
            | TrollHelper_iOS15.ipa | A11及以下 (arm64) | 14.0-15.4.1 |
            | TrollHelper_arm64e.ipa | A12+ (arm64e) | 14.0-15.6.1 |

            ### Usage
            Host IPA + manifest.plist on HTTPS server, install via itms-services:// link
          draft: true
