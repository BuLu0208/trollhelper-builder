name: Build TrollHelperOTA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Victim IPA from Release
        run: |
          mkdir -p Victim
          curl -sL -o Victim/InstallerVictim.ipa \
            "https://github.com/BuLu0208/trollhelper-builder/releases/download/victim-ipa/com.7thg.flashlight_v3.29.ipa"
          ls -lh Victim/InstallerVictim.ipa

      - name: Extract Team ID from Victim IPA
        id: teamid
        run: |
          mkdir -p /tmp/ipa_check
          unzip -q Victim/InstallerVictim.ipa -d /tmp/ipa_check
          cd /tmp/ipa_check/Payload
          APP_DIR=$(find . -maxdepth 1 -type d -mindepth 1 | head -1)
          BINARY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_DIR/Info.plist")
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_DIR/Info.plist")"
          echo "Version: $(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_DIR/Info.plist")"
          echo "Binary: $BINARY_NAME"
          TEAM_ID=$(codesign -dvv "$APP_DIR/$BINARY_NAME" 2>&1 | grep "TeamIdentifier" | awk '{print $NF}')
          echo "Team ID: $TEAM_ID"
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_OUTPUT

      - name: Setup tools
        run: |
          brew install openssl ldid

      - name: Clone TrollStore (Pwnify + make_cert.sh only)
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com/opa334/TrollStore.git TSBUILD

      - name: Generate victim certificate
        run: |
          cd TSBUILD/Victim
          chmod +x make_cert.sh
          export PATH="$(brew --prefix openssl)/bin:$PATH"
          ./make_cert.sh "${{ steps.teamid.outputs.TEAM_ID }}"
          echo "证书生成完成"
          ls -lh victim.p12

      - name: Build Pwnify
        run: |
          cd TSBUILD/Pwnify
          make
          echo "Pwnify 编译完成"
          ls -lh pwnify

      - name: Build TrollHelperOTA iOS15 (arm64)
        run: |
          echo "=== build_installer15 ==="
          mkdir -p ./_build/tmp15

          # 作者 Makefile build_installer15 原始流程:
          # 1. unzip Victim IPA
          unzip $GITHUB_WORKSPACE/Victim/InstallerVictim.ipa -d ./_build/tmp15
          # 2. cp PersistenceHelper
          cp $GITHUB_WORKSPACE/helpers/PersistenceHelper_Embedded_Legacy_arm64 ./_build/TrollStorePersistenceHelperToInject
          # 3. pwnify set-cpusubtype 1
          ./TSBUILD/Pwnify/pwnify set-cpusubtype ./_build/TrollStorePersistenceHelperToInject 1
          # 4. ldid 签名（用 -S + entitlements.plist，和作者 Makefile LEGACY_CT_BUG 一致）
          ldid -S./TSBUILD/TrollHelper/entitlements.plist -K./TSBUILD/Victim/victim.p12 ./_build/TrollStorePersistenceHelperToInject
          # 5. 找到 victim binary 并注入
          APP_PATH=$(find ./_build/tmp15/Payload -name "*" -depth 1)
          APP_NAME=$(basename "$APP_PATH")
          BINARY_NAME=$(echo "$APP_NAME" | cut -f 1 -d '.')
          echo "Inject into: $APP_NAME/$BINARY_NAME"
          ./TSBUILD/Pwnify/pwnify pwn "./_build/tmp15/Payload/$APP_NAME/$BINARY_NAME" ./_build/TrollStorePersistenceHelperToInject
          # 6. 打包
          pushd ./_build/tmp15
          zip -vrD ../../TrollHelper_iOS15.ipa *
          popd
          rm ./_build/TrollStorePersistenceHelperToInject
          rm -rf ./_build/tmp15
          echo "=== TrollHelper_iOS15.ipa 完成 ==="
          ls -lh TrollHelper_iOS15.ipa

      - name: Build TrollHelperOTA arm64e
        run: |
          echo "=== build_installer64e ==="
          mkdir -p ./_build/tmp64e

          # 作者 Makefile build_installer64e 原始流程:
          # 1. unzip Victim IPA
          unzip $GITHUB_WORKSPACE/Victim/InstallerVictim.ipa -d ./_build/tmp64e
          # 2. 找到 victim binary 并注入 (不签名)
          APP_PATH=$(find ./_build/tmp64e/Payload -name "*" -depth 1)
          APP_NAME=$(basename "$APP_PATH")
          BINARY_NAME=$(echo "$APP_NAME" | cut -f 1 -d '.')
          echo "Inject into: $APP_NAME/$BINARY_NAME"
          ./TSBUILD/Pwnify/pwnify pwn64e "./_build/tmp64e/Payload/$APP_NAME/$BINARY_NAME" $GITHUB_WORKSPACE/helpers/PersistenceHelper_Embedded_Legacy_arm64e
          # 3. 打包
          pushd ./_build/tmp64e
          zip -vrD ../../TrollHelper_arm64e.ipa *
          popd
          rm -rf ./_build/tmp64e
          echo "=== TrollHelper_arm64e.ipa 完成 ==="
          ls -lh TrollHelper_arm64e.ipa

      - name: Upload IPAs
        uses: actions/upload-artifact@v4
        with:
          name: TrollHelperOTA-IPAs
          path: |
            TrollHelper_iOS15.ipa
            TrollHelper_arm64e.ipa
          retention-days: 7
