name: Build TrollHelperOTA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Victim IPA
        run: |
          mkdir -p VictimIPA
          curl -sL -o VictimIPA/victim.ipa "https://github.com/BuLu0208/trollhelper-builder/releases/download/victim-ipa/com.7thg.flashlight_v3.29.ipa"
          ls -lh VictimIPA/victim.ipa

      - name: Extract Team ID from Victim IPA
        run: |
          mkdir -p ipa_check
          unzip -q VictimIPA/victim.ipa -d ipa_check
          cd ipa_check/Payload

          APP_DIR=$(find . -maxdepth 1 -type d -mindepth 1 | head -1)
          BINARY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_DIR/Info.plist")
          BINARY_PATH="$APP_DIR/$BINARY_NAME"

          echo "=== Victim App Info ==="
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_DIR/Info.plist")"
          echo "Version: $(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_DIR/Info.plist")"
          echo "Min OS: $(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_DIR/Info.plist" 2>/dev/null || echo 'N/A')"
          echo "Binary: $BINARY_NAME"
          echo "========================"

          # 提取 Team ID
          TEAM_ID=$(codesign -dvv "$BINARY_PATH" 2>&1 | grep "TeamIdentifier" | awk '{print $NF}')
          echo "Team ID: $TEAM_ID"
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV

          if [ -z "$TEAM_ID" ]; then
            echo "ERROR: Could not extract Team ID"
            exit 1
          fi

      - name: Install dependencies
        run: |
          brew install openssl ldid

      - name: Generate victim certificate
        run: |
          # 使用 TrollStore 2.1.1 的 Victim/make_cert.sh
          git clone --depth 1 --branch 2.1.1 https://github.com/opa334/TrollStore.git TSBUILD
          cd TSBUILD/Victim
          chmod +x make_cert.sh
          # macOS LibreSSL 不支持 copy_extensions，把 brew openssl 放到 PATH 最前面
          export PATH="$(brew --prefix openssl)/bin:$PATH"
          ./make_cert.sh "$TEAM_ID"
          echo "证书生成完成"
          ls -lh victim.p12

      - name: Build TrollHelperOTA IPA
        run: |
          cd TSBUILD

          # 编译 Pwnify
          cd Pwnify && make && cd ..

          # 编译 PersistenceHelper (Legacy arm64, 兼容 iOS 14)
          make PersistenceHelper_Embedded_Legacy_arm64

          # 解压 Victim IPA
          mkdir -p build_dir
          unzip -q ../../VictimIPA/victim.ipa -d build_dir

          APP_DIR=$(find build_dir/Payload -maxdepth 1 -type d -mindepth 1 | head -1)
          BINARY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_DIR/Info.plist")
          BINARY_PATH="$APP_DIR/$BINARY_NAME"

          echo "=== 注入 PersistenceHelper ==="
          echo "Victim Binary: $BINARY_PATH"
          echo "Team ID: $TEAM_ID"

          # 注入
          ./pwnify/pwnify pwn "$BINARY_PATH" ./PersistenceHelper_Embedded_Legacy_arm64 arm64

          # 签名
          ldid -s -K./Victim/victim.p12 "$BINARY_PATH"

          # 重新打包
          cd build_dir
          zip -r ../TrollHelperOTA_iphoneos-arm64.ipa Payload
          cd ..

          echo ""
          echo "=== 构建完成 ==="
          ls -lh TrollHelperOTA_iphoneos-arm64.ipa

      - name: Upload TrollHelperOTA IPA
        uses: actions/upload-artifact@v4
        with:
          name: TrollHelperOTA-arm64
          path: TrollHelperOTA_iphoneos-arm64.ipa
          retention-days: 7
